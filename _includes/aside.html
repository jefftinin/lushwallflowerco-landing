  <aside class="bg-dark">
      <div class="container text-center">
          <div class="call-to-action">
              <h2>{% if site.data.closing.meta %}{{ site.location | escape }} &middot; {{ site.launch_status }}{% else %}{{ site.data.closing.title }}{% endif %}</h2>
              <a href="{% if site.data.closing.button.email %}mailto:{{ site.email }}{% else %}{{ site.data.closing.button.href }}{% endif %}" class="btn btn-default btn-xl wow tada">{{ site.data.closing.button.text }}</a>
          </div>
      </div>
  </aside>
