<section class="bg-primary" id="about">
    <div class="container">
        <div class="row">
            <div class="col-lg-8 col-lg-offset-2 text-center">
                <h2 class="section-heading">{{ site.data.about.title }}</h2>
                <hr class="light">
                <p class="text-faded">{{ site.data.about.text }}</p>
                <ul class="feature-facts">
                    {% for fact in site.data.about.facts %}
                    <li>
                        <i class="fa fa-{{ fact.icon }}"></i>
                        <span>{% if fact.text %}{{ fact.text }}{% elsif fact.escape_html %}{{ site[fact.site_key] | escape }}{% else %}{{ site[fact.site_key] }}{% endif %}</span>
                    </li>
                    {% endfor %}
                </ul>
                <a href="{% if site.data.about.button.email %}mailto:{{ site.email }}{% else %}{{ site.data.about.button.href }}{% endif %}" class="btn btn-default btn-xl">{{ site.data.about.button.text }}</a>
            </div>
        </div>
    </div>
</section>
