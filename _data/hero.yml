# Top of the page (the big image header)
title: Something lush is blooming in Negros
text: High-density, full-bloom silk floral walls that make every portrait look like a masterpiece &mdash; for weddings in Silay, parties in Bacolod, and intimate celebrations anywhere in Negros.

# Small badges under the hero text. `icon` is a Font Awesome class.
badges:
  - icon: map-marker
    # site_key: pull the text from a _config.yml value (site.<key>)
    site_key: location
    escape_html: true
  - icon: calendar
    site_key: launch_status

button:
  text: Find Out More
  anchor: about
