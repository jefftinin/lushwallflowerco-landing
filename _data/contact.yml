# "Let's Get In Touch!" section
heading: Let's Get In Touch!
text: Send over your date and venue. We'll reply with availability and a quote of the pricing.
# `meta: true` renders "<location> &middot; <launch_status>"; set a plain `meta` string instead if you prefer.
meta: true

# Each entry becomes one of the contact columns.
# `email` / `phone` build the link and pull the text from that _config.yml setting.
details:
  - icon: envelope-o
    email: true
  - icon: phone
    phone: true
